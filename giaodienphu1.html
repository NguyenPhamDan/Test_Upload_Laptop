<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LapSelect | Thư viện thông số laptop</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="fegdphu.css">
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<a class="brand" href="giaodienchinh.html"><span class="brand-mark">LS</span><span>LapSelect</span></a>
			<a class="back-link" href="giaodienchinh.html">← Về trang tư vấn</a>
		</div>
	</header>

	<main class="container">
		<section class="intro">
			<p class="eyebrow">THƯ VIỆN THÔNG SỐ</p>
			<h1>Khám phá chi tiết<br><em>từng lựa chọn.</em></h1>
			<p class="intro-copy">Tìm kiếm trong danh sách laptop và chọn một mẫu để xem đầy đủ cấu hình, màn hình, kết nối và thông tin sử dụng.</p>
		</section>

		<section class="browser-shell">
			<div class="toolbar">
				<label class="search-box" for="search-input"><span>⌕</span><input id="search-input" type="search" placeholder="Tìm theo tên, hãng, CPU hoặc GPU..." autocomplete="off"></label>
				<select id="category-filter" aria-label="Lọc theo nhu cầu">
					<option value="all">Tất cả nhu cầu</option>
					<option value="van_phong">Văn phòng / Học tập</option>
					<option value="gaming">Gaming</option>
					<option value="do_hoa">Đồ họa / Máy trạm</option>
				</select>
				<span id="list-count" class="list-count"></span>
			</div>
			<div id="laptop-list" class="laptop-list" aria-live="polite"></div>
		</section>
	</main>

	<div id="detail-modal" class="modal" hidden>
		<div class="modal-backdrop" data-close-modal></div>
		<section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
			<button class="close-button" type="button" aria-label="Đóng" data-close-modal>×</button>
			<div id="detail-content"></div>
		</section>
	</div>

	<footer class="container footer">Dữ liệu thao khảo; giá bán có thể khác so với thị trường.</footer>
	<script src="data2.js"></script>
	<script src="logicgdphu.js"></script>
</body>
</html>
